providers:
  lmstudio:
    adapter: openai_compatible
    base_url: ${LMSTUDIO_BASE_URL}
    api_key: lm-studio
    model: ${LMSTUDIO_MODEL}
    capabilities:
      tools: true
      json_schema: false
      streaming: true
      reasoning: false
      context_window: 8192
    extra_body:
      reasoning_effort: none
  mock:
    adapter: mock
    model: ${LMSTUDIO_MODEL}
    fixtures: evals/fixtures/mock_provider
  # DeepSeek's OpenAI-compatible API. Values verified on 2026-11-12 against
  # https://api-docs.deepseek.com/quick_start/pricing and
  # https://api-docs.deepseek.com/api/create-chat-completion: both listed
  # models accept tools and streaming, the context window is 1M and thinking
  # is on by default. `json_schema` is false because the API accepts
  # response_format `json_object`, not a JSON schema, so the adapter uses the
  # forced tool-call strategy. `reasoning_effort: none` keeps plans and data
  # calls non-thinking (design 8.3); `tool_choice: "required"` is rejected in
  # thinking mode. The key may be absent for a local-only setup: the config
  # still loads, and building this provider without a key fails at startup.
  deepseek:
    adapter: openai_compatible
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY:-}
    model: deepseek-flash
    # DeepSeek rejects function names outside this pattern, so the @major
    # suffix of a wire name is sent as _major and mapped back on the response.
    # The tool, audit row and trace still use the original wire name.
    tool_name_pattern: "^[a-zA-Z0-9_-]+$"
    capabilities:
      tools: true
      json_schema: false
      streaming: true
      reasoning: true
      context_window: 1000000
    extra_body:
      reasoning_effort: none
    # Retry and fallback policy (design 6.6 and 8.4). The retry budget is only
    # used by the fallback decorator, so leaving `fallback_provider` unset also
    # leaves transient errors unretried here. A comparison run must not
    # silently score a second provider, so the demo config sets none. Example:
    #   fallback_provider: lmstudio
  # Anthropic's Messages API through the official `anthropic` SDK (design 8.1,
  # 8.2 and 8.5). Model, context window, output limit and prices were verified
  # on 2026-11-13 against
  # https://platform.claude.com/docs/en/models/overview and
  # https://platform.claude.com/docs/en/about-claude/pricing: claude-sonnet-5-5,
  # 1M context, 128K output, 2.00 input, 2.50 five-minute cache write, 0.10
  # cache read and 10.00 output USD per million tokens. `json_schema` is false
  # because the adapter uses the forced tool-call strategy for structured
  # output. `reasoning` is false because the adapter exposes no thinking or
  # effort switch, even though the model can think adaptively. No tenant
  # selects this provider by default; the key is read from the environment when
  # the provider is built, so the rest of the config loads without it.
  anthropic:
    adapter: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-5-5
    # The Messages API requires max_tokens on every request; a request may
    # still ask for less.
    max_tokens: 4096
    # The API accepts only letters, digits, _ and - in a tool name, so the
    # @major suffix is sent as _major and mapped back to the wire name.
    tool_name_pattern: "^[A-Za-z0-9_-]{1,128}$"
    capabilities:
      tools: true
      json_schema: false
      streaming: true
      reasoning: false
      context_window: 1000000
embedders:
  lmstudio:
    adapter: openai_compatible
    base_url: ${LMSTUDIO_BASE_URL}
    api_key: lm-studio
    model: ${LMSTUDIO_EMBEDDING_MODEL}
    dimension: 1024
  mock:
    adapter: mock
    dimension: 1024
