# langgraph is the default; agent_loop is the second adapter (design 6.9,
# ADR 0002) and is selected with the same key, no code change.
orchestrator: langgraph
tool_sources:
  - name: olist
    adapter: mcp
    url: ${MCP_OLIST_URL}/mcp
    # Lets the API check tenant tool allowlists against the wire names the
    # server actually serves (design.md sections 7.2 and 11).
    manifest: mcp_servers/olist/manifest.yaml
  # Second data source, a TypeScript MCP server (T3.08). One run token with the
  # platform-wide audience reaches both sources; each server enforces its own
  # allowlist and seller scope from the shared tenants file.
  - name: reviews
    adapter: mcp
    url: ${MCP_REVIEWS_URL}/mcp
    manifest: mcp_servers/reviews/manifest.yaml
retriever: pgvector
# The semantic cache (design 10, ADR 0007). Two registered adapters:
#   pg_semantic     entries in public.cache_entries with a pgvector HNSW index
#                   (the default; the demo stays on Postgres)
#   valkey_semantic entries in Valkey with the valkey-search module, same key,
#                   same tenant/version/TTL scoping, same threshold (T3.09,
#                   evals/reports/cache-adapters.md has the comparison)
# `none` keeps every lookup a miss without dropping the adapter; a tenant only
# uses the cache when its own `cache.enabled` is true. The demo tenants keep it
# false: the cache suite measured a false-hit rate of 0.04 at the chosen 0.94
# threshold, above the 0.02 target (evals/reports/cache-lmstudio.md). Set
# enabled true per tenant to turn it on without a code change. Switching to
# valkey_semantic needs the `valkey` compose service and VALKEY_URL; the
# adapter reads the tenant's doc index version from public.tenants, so
# PostgreSQL stays required.
cache: pg_semantic
embedder: lmstudio
context_policy: clear_oldest_tool_results
tracing:
  # postgres writes to public.spans (the default); otlp sends the same spans
  # to a collector such as Jaeger; none leaves the OTel API a no-op. The
  # substitution lets `docker compose --profile tracing` switch both the API
  # and the MCP server through the container environment (design 12.2).
  exporter: ${SWITCHBOARD_TRACING_EXPORTER:-postgres}
# One eval run against a paid provider must estimate at or below this (USD) and
# carry --confirm-cost; see design 20.2.
cost_cap_usd: 5.0
# Layer 2 of the quality gate (design 6.8): one local model call per answer that
# layers 1 passed. Off by default, because whether the judge agrees with a human
# enough to be trusted is a measurement, not an assumption. The run that decides
# it is `switchboard eval judge-agreement` over evals/judge/agreement.jsonl; its
# report is evals/reports/judge-agreement.md. The same judge scores rag answers
# when `switchboard eval run --suite rag --judge` is passed.
judge:
  enabled: false
  provider: lmstudio
  # An "acceptable" verdict counts only when the model's own score also clears
  # this, so a low-confidence pass is a rejection.
  threshold: 0.5
  # Evidence text one judge call sees per item.
  max_evidence_chars: 2000
limits:
  run_timeout_s: 60
  max_tool_steps: 4
  max_loop_steps: 8
  max_plan_size: 3
  fallback_plan: ["docs", "data"]
  model_view_rows: 20
  context_fill: 0.7
  history_turns: 3
