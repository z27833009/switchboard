orchestrator: langgraph
tool_sources:
  - name: olist
    adapter: mcp
    url: ${MCP_OLIST_URL}/mcp
    # Lets the API check tenant tool allowlists against the wire names the
    # server actually serves (design.md sections 7.2 and 11).
    manifest: mcp_servers/olist/manifest.yaml
retriever: pgvector
cache: none
embedder: lmstudio
context_policy: clear_oldest_tool_results
tracing:
  exporter: postgres
# One eval run against a paid provider must estimate at or below this (USD) and
# carry --confirm-cost; see design 20.2.
cost_cap_usd: 5.0
limits:
  run_timeout_s: 60
  max_tool_steps: 4
  max_loop_steps: 8
  max_plan_size: 3
  fallback_plan: ["docs", "data"]
  model_view_rows: 20
  context_fill: 0.7
  history_turns: 3
