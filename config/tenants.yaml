# Tenant configuration (design.md sections 7.3 and 11).
#
# `provider` and a non-empty `agents.allow` are required; the other keys have
# Unknown keys are rejected at startup, as are unknown agent names (the API)
# and unknown tool wire names (the API checks them against every manifest
# declared in config/platform.yaml; each MCP server checks the names it
# serves).
#
#   provider:  name of a provider in providers.yaml
#   agents.allow: registered agent names the supervisor may plan with; clarify
#                 asks one question and ends the run with needs_clarification
#   tools.allow:  tool wire names the tenant may call without approval
#   tools.ask:    tool wire names that need human approval before a call (T3.01).
#                 The LangGraph path shows them to the model and pauses the run
#                 as waiting_approval; the agent-loop path withholds them, so it
#                 stays read-only. A write tool must be here, never in allow.
#   seller_ids:   null means every seller (unrestricted demo tenant); a list
#                 scopes every tool to those sellers, server-side
#   retrieval:    k, min_score, rewrite, rewrite_mode, search
#                 (defaults: 5, 0.35, false, conditional, vector). search
#                 hybrid adds full-text search and RRF; rewrite true enables
#                 the conditional rewrite of design.md section 9.3
#   cache:        enabled, threshold, ttl_days (defaults: false, 0.92, 7).
#                 The demo tenants use 0.94, chosen from
#                 evals/reports/cache-lmstudio.md, but keep enabled false: the
#                 measured false-hit rate is above the 2 percent target.
#
# Tools not listed under allow or ask are denied. The tool server takes the
# tenant from the signed run token and never from request arguments. The two
# review tools come from mcp_servers/reviews (TypeScript); only seller_a allows
# them, so the default tenant and the eval tool lists stay unchanged.
tenants:
  default:
    provider: lmstudio
    agents:
      allow: ["direct", "docs", "data", "clarify"]
    tools:
      allow:
        - orders_summary@1
        - orders_late@1
        - order_lookup@1
        - top_products@1
        - describe_schema@1
      ask: []
    seller_ids: null
    retrieval:
      search: hybrid
      rewrite: true
    cache:
      # Measured on 2026-11-13, bge-m3 + dataset v5: 0.94 hits 1 of 25
      # paraphrases and false-hits 1 of 25 near misses (4 percent). The
      # false-hit target is 2 percent, so the demo leaves the cache off and
      # the report explains why; set enabled true to turn it on.
      # See evals/reports/cache-lmstudio.md.
      enabled: false
      threshold: 0.94
      ttl_days: 7
  # A real cross-tenant demo: only seller 955fee... orders are visible, and a
  # request for any other order or for a tool outside the allowlist is denied.
  seller_a:
    provider: lmstudio
    agents:
      allow: ["docs", "data", "clarify"]
    tools:
      allow:
        - orders_summary@1
        - order_lookup@1
        - top_products@1
        # Served by mcp_servers/reviews, not by mcp_servers/olist.
        - review_summary@1
        - order_reviews@1
      # The demo write tool (T3.01, ADR 0015). A run that wants to add a note
      # pauses as waiting_approval until POST /runs/{id}/approve.
      ask:
        - add_order_note@1
    seller_ids: ["955fee9216a65b617aa5c0531780ce60"]
    retrieval:
      search: hybrid
      rewrite: true
    cache:
      enabled: false
      threshold: 0.94
      ttl_days: 7
