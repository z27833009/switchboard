name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports
      - name: Unit tests
        run: uv run pytest
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard-dev-postgres
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every value here is a committed development value, never a secret.
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard-dev-postgres
      POSTGRES_DB: switchboard
      SWITCHBOARD_APP_DB_PASSWORD: switchboard-dev-app
      SWITCHBOARD_TOOLS_DB_PASSWORD: switchboard-dev-tools
      SWITCHBOARD_DATABASE_ADMIN_URL: postgresql://switchboard:switchboard-dev-postgres@localhost:5432/switchboard
      SWITCHBOARD_DATABASE_URL: postgresql://switchboard_app:switchboard-dev-app@localhost:5432/switchboard
      SWITCHBOARD_TOOLS_DATABASE_URL: postgresql://switchboard_tools:switchboard-dev-tools@localhost:5432/switchboard
      SWITCHBOARD_RUN_TOKEN_SECRET: switchboard-ci-dev-run-token-secret-not-a-real-secret
      SWITCHBOARD_TENANTS_FILE: config/tenants.yaml
      SWITCHBOARD_TRACING_EXPORTER: postgres
      MCP_OLIST_URL: http://localhost:8001
      MCP_OLIST_PORT: "8001"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"
      - name: Install dependencies
        run: uv sync --locked
      - name: Bootstrap the database
        run: uv run python scripts/ci_bootstrap_db.py
      - name: Load the 1000-order sample
        run: >-
          uv run switchboard data load-olist data/olist/sample
          --expected data/olist/sample/expected_counts.json
          --database-url "$SWITCHBOARD_DATABASE_ADMIN_URL"
      - name: Start the Olist MCP server
        run: |
          nohup uv run python -m mcp_servers.olist.server > mcp-olist.log 2>&1 &
          disown
          echo "MCP server started with pid $!"
      - name: Wait for the MCP server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8001/health; then
              exit 0
            fi
            sleep 2
          done
          echo "the MCP server did not become healthy"
          cat mcp-olist.log
          exit 1
      - name: Integration tests
        # LMSTUDIO_BASE_URL is deliberately absent, so tests that need a model skip.
        run: uv run pytest tests/integration -q
      - name: Mock eval suites
        env:
          # Config substitution needs these variables. The mock provider replays
          # recorded output and never connects to the URL.
          LMSTUDIO_BASE_URL: http://127.0.0.1:9/v1
          LMSTUDIO_MODEL: qwen3-8b
          LMSTUDIO_EMBEDDING_MODEL: bge-m3
        run: |
          uv run switchboard eval run --suite routing --provider mock
          uv run switchboard eval run --suite toolcall --provider mock
      - name: Regression gate
        run: |
          uv run switchboard eval gate --suite routing \
            --baseline evals/baselines/routing.json --max-drop 0.05
          uv run switchboard eval gate --suite toolcall \
            --baseline evals/baselines/toolcall.json --max-drop 0.05
