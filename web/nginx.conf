server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is mounted under /api so the browser can use a relative base path
    # on every host. The trailing slash on proxy_pass strips /api/ before the
    # request reaches the api service (design.md section 12.3).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # POST /chat/stream is server-sent events and must not be buffered.
        # The API also sends X-Accel-Buffering: no; both are kept because a
        # buffering proxy would hold the live steps until the run ended.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Client-side routes use the URL hash, so this fallback mainly covers a
    # stale link to a file that no longer exists. It still keeps any path on the
    # SPA instead of returning nginx's 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
