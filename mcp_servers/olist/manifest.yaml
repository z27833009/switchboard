tools:
  - name: orders_summary
    version: "1"
    description: Count orders, items and revenue for a purchase-date range, optionally filtered by status.
    risk: read
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        status:
          type: string
          enum: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
      required: [date_from, date_to]
      additionalProperties: false

  - name: orders_late
    version: "1"
    description: Count late deliveries for a purchase-date range, with average and maximum days late and the matching orders.
    risk: read
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        min_days_late:
          type: integer
          minimum: 1
      required: [date_from, date_to]
      additionalProperties: false

  - name: order_lookup
    version: "1"
    description: Look up one order with its items, customer location and payment totals.
    risk: read
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
      required: [order_id]
      additionalProperties: false

  - name: top_products
    version: "1"
    description: Rank products by revenue or by units sold for a purchase-date range.
    risk: read
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        metric:
          type: string
          enum: [revenue, count]
        limit:
          type: integer
          minimum: 1
          maximum: 200
      required: [date_from, date_to, metric, limit]
      additionalProperties: false

  - name: describe_schema
    version: "1"
    description: Describe the tables and columns available in the Olist schema.
    risk: read
    tenant_scoped: false
    sensitive_args: []
    input_schema:
      type: object
      properties: {}
      additionalProperties: false

  # Free-form SQL is the one tool whose arguments are not a fixed shape, so it
  # ships disabled: no demo tenant lists it in tools.allow, and list_tools hides
  # it from the model. The server still registers it. A tenant opts in by naming
  # this wire name (design.md section 7.1).
  - name: query_readonly_sql
    version: "1"
    description: >-
      Run one read-only SELECT over olist.sql_order_facts, one row per Olist
      order item (order_id, order_item_id, seller_id, product_id, category,
      price, freight_value, order_status, purchase_date, delivered_date,
      estimated_date, days_late). Only that view is allowed, with one SELECT
      statement and no DML, DDL, locking or SELECT INTO. Results are capped at
      200 rows and scoped to the tenant's sellers. Disabled by default: the
      tenant must allow it explicitly.
    risk: read
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        sql:
          type: string
          minLength: 1
          maxLength: 4000
          description: One SELECT statement over olist.sql_order_facts.
      required: [sql]
      additionalProperties: false

  # The one write tool (T3.01, ADR 0015). It appends one note row and changes
  # nothing else, and every tenant that lists it must list it under tools.ask,
  # so the orchestrator pauses for a human decision before it runs.
  - name: add_order_note
    version: "1"
    description: >-
      Add a note to one of this tenant's orders: a short free-text remark kept
      in a separate append-only note table for follow-up. It never changes the
      order status or any existing record, and it needs human approval before
      it runs, so the run pauses and asks the user first.
    risk: write
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        order_id:
          type: string
          minLength: 1
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: The note text, at most 500 characters.
      required: [order_id, note]
      additionalProperties: false
