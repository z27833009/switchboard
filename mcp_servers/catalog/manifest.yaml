tools:
  - name: catalog_search
    version: "1"
    description: Search the local product catalog by name or category and return matching products with prices.
    risk: read
    tenant_scoped: true
    sensitive_args: []
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 120
        limit:
          type: integer
          minimum: 1
          maximum: 20
      required: [query]
      additionalProperties: false
