name: switchboard

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: switchboard-app:local
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-switchboard}
      SWITCHBOARD_APP_DB_PASSWORD: ${SWITCHBOARD_APP_DB_PASSWORD:?set SWITCHBOARD_APP_DB_PASSWORD in .env}
      SWITCHBOARD_TOOLS_DB_PASSWORD: ${SWITCHBOARD_TOOLS_DB_PASSWORD:?set SWITCHBOARD_TOOLS_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-switchboard} -d ${POSTGRES_DB:-switchboard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mcp-olist:
    <<: *app
    command: ["python", "-m", "mcp_servers.olist.server"]
    environment:
      SWITCHBOARD_RUN_TOKEN_SECRET: "${SWITCHBOARD_RUN_TOKEN_SECRET:?set SWITCHBOARD_RUN_TOKEN_SECRET in .env (at least 32 bytes)}"
      SWITCHBOARD_TOOLS_DATABASE_URL: "postgresql://switchboard_tools:${SWITCHBOARD_TOOLS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-switchboard}"
      SWITCHBOARD_TENANTS_FILE: "/app/config/tenants.yaml"
      MCP_OLIST_PORT: "8001"
      # Both tracing variables are harmless without the tracing profile: the
      # exporter stays postgres by default and the endpoint is only read when
      # it is otlp (design 12.2).
      SWITCHBOARD_TRACING_EXPORTER: "${SWITCHBOARD_TRACING_EXPORTER:-postgres}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mcp-reviews:
    build:
      context: ./mcp_servers/reviews
      dockerfile: Dockerfile
    image: switchboard-mcp-reviews:local
    restart: unless-stopped
    command: ["node", "dist/src/index.js"]
    environment:
      # The same secret and audience as the API and mcp-olist: one run token is
      # valid at every MCP server (ADR 0014, T3.08).
      SWITCHBOARD_RUN_TOKEN_SECRET: "${SWITCHBOARD_RUN_TOKEN_SECRET:?set SWITCHBOARD_RUN_TOKEN_SECRET in .env (at least 32 bytes)}"
      SWITCHBOARD_TOOLS_DATABASE_URL: "postgresql://switchboard_tools:${SWITCHBOARD_TOOLS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-switchboard}"
      SWITCHBOARD_TENANTS_FILE: "/app/config/tenants.yaml"
      SWITCHBOARD_REVIEWS_MANIFEST: "/app/manifest.yaml"
      MCP_REVIEWS_PORT: "8002"
    volumes:
      # The tenant file is shared with the API and mcp-olist; a mount keeps one
      # copy the source of truth instead of baking a second one into the image.
      - ./config/tenants.yaml:/app/config/tenants.yaml:ro
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8002/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *app
    command:
      [
        "uvicorn",
        "switchboard.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      SWITCHBOARD_RUN_TOKEN_SECRET: "${SWITCHBOARD_RUN_TOKEN_SECRET:?set SWITCHBOARD_RUN_TOKEN_SECRET in .env (at least 32 bytes)}"
      SWITCHBOARD_DATABASE_URL: "postgresql://switchboard_app:${SWITCHBOARD_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-switchboard}"
      SWITCHBOARD_TOOLS_URL: "http://mcp-olist:8001"
      MCP_OLIST_URL: "http://mcp-olist:8001"
      MCP_REVIEWS_URL: "http://mcp-reviews:8002"
      LMSTUDIO_BASE_URL: "http://host.docker.internal:18080/v1"
      LMSTUDIO_MODEL: "${LMSTUDIO_MODEL:-qwen3-8b}"
      LMSTUDIO_EMBEDDING_MODEL: "${LMSTUDIO_EMBEDDING_MODEL:-bge-m3}"
      # Only read when platform.yaml selects `cache: valkey_semantic`; the
      # default `pg_semantic` never contacts it (T3.09).
      VALKEY_URL: "valkey://valkey:6379/0"
      # Empty is allowed for local-only use; the deepseek provider then fails at
      # startup if a tenant selects it, before any request.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # No tenant selects the anthropic provider by default; the API still
      # reads the key so a tenant switched to it later needs only the env.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SWITCHBOARD_TRACING_EXPORTER: "${SWITCHBOARD_TRACING_EXPORTER:-postgres}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-olist:
        condition: service_healthy
      mcp-reviews:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: switchboard-web:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Semantic cache store behind the Cache port (T3.09, ADR 0003). The bundle
  # image carries the valkey-search module that serves the KNN lookup, pinned by
  # tag and digest. It is a cache: no append-only file and no snapshot, so a
  # restart starts empty and Postgres keeps the durable copy. The default
  # config keeps `cache: pg_semantic`, so the demo does not depend on it.
  valkey:
    image: valkey/valkey-bundle:9.0-alpine@sha256:508ee27b6e8b8e516c837259dac179f42188ce158279c4c0814fde019861981e
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--appendonly",
        "no",
        "--save",
        "",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Optional trace viewer: `docker compose --profile tracing up -d` starts it
  # and the API/MCP exporter is switched with SWITCHBOARD_TRACING_EXPORTER=otlp.
  # It is not part of the default stack and the API never depends on it.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["tracing"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
      - "4317:4317"
    healthcheck:
      # The all-in-one image is Alpine and ships wget; the admin port answers
      # even when no trace has arrived yet.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
