[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[project]
name = "switchboard"
version = "0.1.0"
description = "A source-available multi-agent platform where every routing decision is traced."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Jiajun", email = "15662733+z27833009@users.noreply.github.com" }]
keywords = ["agents", "mcp", "opentelemetry", "evaluation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "asyncpg==0.32.0",
  "fastapi==0.162.5",
  "langgraph==1.2.21",
  "mcp==2.3.0",
  "openai==3.49.0",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "pydantic==2.14.3",
  "pyjwt==2.15.1",
  "pyyaml==6.0.3",
  "typer==0.29.1",
  "uvicorn==0.54.0",
]

[project.scripts]
switchboard = "switchboard.cli:app"

[project.entry-points."switchboard.providers"]
openai_compatible = "switchboard.adapters.providers.openai_compat:OpenAICompatibleProvider"
mock = "switchboard.adapters.providers.mock:MockProvider"

[project.entry-points."switchboard.embedders"]
openai_compatible = "switchboard.adapters.embedders.openai_compat:OpenAICompatibleEmbedder"
mock = "switchboard.adapters.embedders.mock:MockEmbedder"

[project.entry-points."switchboard.tool_sources"]
mcp = "switchboard.adapters.tools.mcp_client:McpToolSource"

[project.entry-points."switchboard.retrievers"]
pgvector = "switchboard.adapters.retrievers.pgvector:PgVectorRetriever"

[project.entry-points."switchboard.caches"]
none = "switchboard.adapters.cache.none:NoCache"
pg_semantic = "switchboard.adapters.cache.pg_semantic:PgSemanticCache"

[project.entry-points."switchboard.agents"]
direct = "switchboard.agents.direct:DirectAgent"
docs = "switchboard.agents.docs:DocsAgent"
data = "switchboard.agents.data:DataAgent"
clarify = "switchboard.agents.clarify:ClarifyAgent"

[project.entry-points."switchboard.orchestrators"]
langgraph = "switchboard.adapters.orchestrator.langgraph_impl:LangGraphOrchestrator"
agent_loop = "switchboard.adapters.orchestrator.agent_loop:AgentLoopOrchestrator"

[project.entry-points."switchboard.eval_suites"]
routing = "switchboard.eval.suites.routing:RoutingSuite"
toolcall = "switchboard.eval.suites.toolcall:ToolCallSuite"
gate = "switchboard.eval.suites.gate:GateSuite"
rag = "switchboard.eval.suites.rag:RagSuite"
injection = "switchboard.eval.suites.injection:InjectionSuite"
cache = "switchboard.eval.suites.cache:CacheSuite"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "import-linter==2.16",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
]

[tool.uv]
# The package is a library plus an application; it must be importable from
# tests and, from T1.04 on, resolvable through entry points.
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Ruff formats Python code blocks in Markdown; the specification is prose.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Sibling imports by design: these scripts are run from their own directory.
# Long template strings and Chinese full-width punctuation are intentional.
"evals/scripts/*.py" = ["E402", "E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "mcp_servers"]
mypy_path = "src"
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# asyncpg and PyYAML do not ship type information.
module = ["asyncpg", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs the compose PostgreSQL with the Olist data loaded",
]

[tool.importlinter]
root_package = "switchboard"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core imports nothing"
type = "forbidden"
source_modules = ["switchboard.core"]
# Any sibling package (agents, adapters, api, tracing, ...) is forbidden, so
# the rule holds as packages are added. Core importing its own modules is the
# one allowed case. The unit test in tests/unit/test_core_imports.py adds the
# external half of the rule: standard library and pydantic only.
forbidden_modules = [
  "switchboard.*",
  "fastapi",
  "uvicorn",
  "langgraph",
  "openai",
  "mcp",
  "asyncpg",
  "opentelemetry",
  "jwt",
  "yaml",
  "typer",
]
ignore_imports = ["switchboard.core -> switchboard.core.*"]
unmatched_ignore_imports_alerting = "none"
